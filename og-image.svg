    <circle cx="149" cy="314" r="25" fill="#6d28d9" opacity="0.08"/>
    <circle cx="521" cy="108" r="82" fill="#6d28d9" opacity="0.12"/>
    <circle cx="714" cy="270" r="29" fill="#6d28d9" opacity="0.12"/>
    <circle cx="144" cy="505" r="37" fill="#6d28d9" opacity="0.05"/>
    <rect x="547" y="705" width="83" height="89" rx="8" fill="#7c3aed" opacity="0.05" transform="rotate(7, 302, -42)"/>
