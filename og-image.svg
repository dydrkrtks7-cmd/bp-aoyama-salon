    <rect x="219" y="39" width="59" height="81" rx="8" fill="#7c3aed" opacity="0.04" transform="rotate(4, 128, 615)"/>
    <rect x="524" y="470" width="44" height="21" rx="8" fill="#7c3aed" opacity="0.15" transform="rotate(20, 1002, 459)"/>
    <rect x="964" y="569" width="24" height="50" rx="8" fill="#7c3aed" opacity="0.09" transform="rotate(24, 86, 274)"/>
    <polygon points="836,570 878,654 794,654" fill="#6d28d9" opacity="0.07"/>
    <polygon points="1194,-126 1226,-62 1162,-62" fill="#6d28d9" opacity="0.07"/>
    <polygon points="978,-164 1049,-22 907,-22" fill="#6d28d9" opacity="0.08"/>
    <polygon points="321,474 365,562 277,562" fill="#6d28d9" opacity="0.05"/>

  <!-- Wave at bottom -->
  <path d="M0,566 C360,598 840,534 1200,566 L1200,630 L0,630Z" fill="#6d28d9" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
